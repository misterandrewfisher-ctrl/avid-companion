name: Build Avid Companion Windows

on:
  push:
    branches: [main]
    tags: ['companion-v*', 'v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Create .env
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=https://burcdoowolryklggsgkj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_wunQ43nqsnYde5DGvPrUcQ_pt5UbBkZ
          VITE_AVID_API_BASE=${{ secrets.VITE_AVID_API_BASE }}
          VITE_COMPANION_SECRET=${{ secrets.VITE_COMPANION_SECRET }}
          EOF

      - name: Preflight — verify env
        shell: bash
        run: |
          MISSING=0
          for KEY in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_AVID_API_BASE VITE_COMPANION_SECRET; do
            VAL=$(grep "^${KEY}=" .env | cut -d= -f2-)
            if [ -z "$VAL" ]; then
              echo "❌ MISSING: $KEY"; MISSING=1
            else
              echo "✅ $KEY is set (${#VAL} chars)"
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "Add missing values under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avid-companion-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: Generate latest.json update manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          ZIP=$(ls "$BUNDLE"/nsis/*.nsis.zip 2>/dev/null | head -1 || true)
          SIG=$(ls "$BUNDLE"/nsis/*.nsis.zip.sig 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ] || [ -z "$SIG" ]; then
            echo "❌ No signed updater artifact found in $BUNDLE/nsis."
            echo "   Check bundle.createUpdaterArtifacts is true and TAURI_SIGNING_PRIVATE_KEY is set."
            ls -R "$BUNDLE" || true
            exit 1
          fi

          ZIP_NAME=$(basename "$ZIP")
          SIGNATURE=$(cat "$SIG")
          TAG="${GITHUB_REF#refs/tags/}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP_NAME}"

          export VERSION SIGNATURE URL
          export OUT="$BUNDLE/latest.json"
          node -e 'const fs=require("fs");fs.writeFileSync(process.env.OUT,JSON.stringify({version:process.env.VERSION,notes:"Avid Companion "+process.env.VERSION,pub_date:new Date().toISOString(),platforms:{"windows-x86_64":{signature:process.env.SIGNATURE,url:process.env.URL}}},null,2));'

          echo "✅ Wrote $OUT"
          cat "$OUT"

      - name: Attach installers and update payload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/release/bundle/latest.json
